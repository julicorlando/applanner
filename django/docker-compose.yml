x-app-environment: &app-environment
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
  DJANGO_FIELD_ENCRYPTION_KEY: ${DJANGO_FIELD_ENCRYPTION_KEY}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
  DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS}
  DATABASE_URL: ${DATABASE_URL}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
  TIME_ZONE: ${TIME_ZONE:-America/Recife}
  SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-true}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
  EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
  EMAIL_HOST: ${EMAIL_HOST:-}
  EMAIL_PORT: ${EMAIL_PORT:-587}
  EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
  EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
  EMAIL_USE_TLS: ${EMAIL_USE_TLS:-true}
  EMAIL_USE_SSL: ${EMAIL_USE_SSL:-false}
  EMAIL_TIMEOUT: ${EMAIL_TIMEOUT:-15}
  DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-contato@applanner.com.br}
  WHATSAPP_GRAPH_BASE_URL: ${WHATSAPP_GRAPH_BASE_URL:-}
  WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
  WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
  WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
  WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
  META_PIXEL_ID: ${META_PIXEL_ID:-}
  META_CONVERSION_ACCESS_TOKEN: ${META_CONVERSION_ACCESS_TOKEN:-}
  META_GRAPH_BASE_URL: ${META_GRAPH_BASE_URL:-}
  SENTRY_DSN: ${SENTRY_DSN:-}
  LEGACY_MYSQL_HOST: ${LEGACY_MYSQL_HOST:-}
  LEGACY_MYSQL_PORT: ${LEGACY_MYSQL_PORT:-3306}
  LEGACY_MYSQL_DATABASE: ${LEGACY_MYSQL_DATABASE:-}
  LEGACY_MYSQL_USER: ${LEGACY_MYSQL_USER:-}
  LEGACY_MYSQL_PASSWORD: ${LEGACY_MYSQL_PASSWORD:-}
  LEGACY_APP_KEY: ${LEGACY_APP_KEY:-}
  BACKUP_DIR: ${BACKUP_DIR:-/app/media/backups}
  MASTER_WHATSAPP_GATEWAY_URL: http://master-whatsapp:3100
  MASTER_WHATSAPP_GATEWAY_TOKEN: ${MASTER_WHATSAPP_GATEWAY_TOKEN:-}
  TENANT_WHATSAPP_GATEWAY_URL: http://tenant-whatsapp:3100

services:
  web:
    build: .
    restart: unless-stopped
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media:/app/media
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test "$$(curl -fsS -o /dev/null -w '%{http_code}'
          -H 'X-Forwarded-Proto: https' http://127.0.0.1:8000/healthz/)" = 200
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 5

  worker:
    build: .
    restart: unless-stopped
    environment: *app-environment
    command: ["celery","-A","applanner","worker","-l","INFO","--concurrency=2"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media:/app/media

  beat:
    build: .
    restart: unless-stopped
    environment: *app-environment
    command: ["celery","-A","applanner","beat","-l","INFO","--scheduler","django_celery_beat.schedulers:DatabaseScheduler"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-applanner}
      POSTGRES_USER: ${POSTGRES_USER:-applanner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ${POSTGRES_USER:-applanner} -d ${POSTGRES_DB:-applanner}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server","--appendonly","yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  master-whatsapp:
    build: ./master-whatsapp
    restart: unless-stopped
    environment:
      MASTER_WHATSAPP_GATEWAY_TOKEN: ${MASTER_WHATSAPP_GATEWAY_TOKEN:-}
      MASTER_WHATSAPP_CALLBACK_URL: http://web:8000/master/whatsapp/receber/
    volumes:
      - master_whatsapp_session:/app/session
    expose:
      - "3100"

  tenant-whatsapp:
    build: ./master-whatsapp
    restart: unless-stopped
    command: ["node","tenant-server.js"]
    environment:
      MASTER_WHATSAPP_GATEWAY_TOKEN: ${MASTER_WHATSAPP_GATEWAY_TOKEN:-}
    volumes:
      - tenant_whatsapp_session:/app/session
    expose:
      - "3100"

volumes:
  postgres_data:
  redis_data:
  media:
  master_whatsapp_session:
  tenant_whatsapp_session:
