{% extends "base.html" %}
{% block title %}Recuperar senha — ApPlanner{% endblock %}
{% block content %}
<section class="shell portal-page narrow">
  <div class="portal-heading"><div><span class="eyebrow">SEGURANÇA</span><h1>Recuperar senha</h1><p>Informe seu e-mail para receber um link temporário.</p></div></div>
  <form method="post" class="portal-form panel">{% csrf_token %}
    <div class="form-field"><label>E-mail</label><input type="email" name="email" autocomplete="email" required></div>
    <div class="form-actions"><button class="button primary">Enviar link</button><a class="button ghost" href="{% url 'accounts:login' %}">Voltar</a></div>
  </form>
</section>
{% endblock %}
