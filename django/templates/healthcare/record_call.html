{% if show_call %}<section class="record-tv-call" aria-label="Chamar paciente"><strong>Chamar paciente na TV</strong>{% if call_appointments %}<form data-patient-call method="post" action="{% url 'waiting-room-call' %}">{% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}"><input type="hidden" name="request_id" value="{{ call_request_id }}"><input type="hidden" name="room" value="{{ call_room.name }}"><label>Atendimento <select name="appointment" required>{% for item in call_appointments %}<option value="{{ item.pk }}">{{ item.starts_at|date:'d/m H:i' }} · {{ item.professional.name }}</option>{% endfor %}</select></label><button type="submit" {% if not call_room or not call_enabled %}disabled{% endif %}>Chamar paciente{% if call_room %} · {{ call_room.name }}{% endif %}</button><span role="status" data-call-status></span></form>{% if not call_room %}<button type="button" data-room-open>Escolher sala</button>{% endif %}{% if not call_enabled %}<p>Ative o painel da TV nas configurações.</p>{% endif %}{% else %}<p>Não há atendimento atual autorizado para chamar este paciente.</p>{% endif %}</section>{% endif %}
