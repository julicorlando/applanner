name: Django CI

on:
  pull_request:
    paths:
      - "django/**"
      - ".github/workflows/django-ci.yml"
  push:
    branches:
      - django-replatform
    paths:
      - "django/**"
      - ".github/workflows/django-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: applanner
          POSTGRES_USER: applanner
          POSTGRES_PASSWORD: applanner-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U applanner -d applanner"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: django

    env:
      DJANGO_SECRET_KEY: ci-only-secret-key-not-for-production
      DJANGO_FIELD_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgresql://applanner:applanner-ci@127.0.0.1:5432/applanner
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/1
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/2
      SECURE_SSL_REDIRECT: "false"
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: django/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Django system check
        run: python manage.py check
      - name: Check migrations are committed
        run: python manage.py makemigrations --check --dry-run
      - name: Apply migrations
        run: python manage.py migrate --noinput
      - name: Seed platform data
        run: |
          python manage.py seed_modules
          python manage.py seed_periodic_tasks
      - name: Run tests
        run: python manage.py test
