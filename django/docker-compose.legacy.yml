services:
  legacy-db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${LEGACY_CLONE_DATABASE:-appnannerbr_planner}
      MARIADB_USER: ${LEGACY_CLONE_USER:-legacy}
      MARIADB_PASSWORD: ${LEGACY_CLONE_PASSWORD:-legacy-local-2026}
      MARIADB_ROOT_PASSWORD: ${LEGACY_CLONE_ROOT_PASSWORD:-legacy-root-local-2026}
    volumes:
      - legacy_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u${LEGACY_CLONE_USER:-legacy} -p${LEGACY_CLONE_PASSWORD:-legacy-local-2026} --silent"]
      interval: 10s
      timeout: 5s
      retries: 20

  web:
    environment:
      LEGACY_MYSQL_HOST: legacy-db
      LEGACY_MYSQL_PORT: 3306
      LEGACY_MYSQL_DATABASE: ${LEGACY_CLONE_DATABASE:-appnannerbr_planner}
      LEGACY_MYSQL_USER: ${LEGACY_CLONE_USER:-legacy}
      LEGACY_MYSQL_PASSWORD: ${LEGACY_CLONE_PASSWORD:-legacy-local-2026}
    depends_on:
      legacy-db:
        condition: service_healthy

volumes:
  legacy_mysql_data:
