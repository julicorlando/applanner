{% extends "base.html" %}
{% block title %}Nova senha — ApPlanner{% endblock %}
{% block content %}
<section class="shell portal-page narrow">
  <div class="portal-heading"><div><span class="eyebrow">SEGURANÇA</span><h1>Definir nova senha</h1></div></div>
  <form method="post" class="portal-form panel">{% csrf_token %}
    <div class="form-field"><label>Nova senha</label><input type="password" name="password" minlength="8" autocomplete="new-password" required></div>
    <div class="form-field"><label>Confirmar nova senha</label><input type="password" name="password_confirmation" minlength="8" autocomplete="new-password" required></div>
    <div class="form-actions"><button class="button primary">Salvar nova senha</button></div>
  </form>
</section>
{% endblock %}
