services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media:/app/media
    expose:
      - "8000"

  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    entrypoint: []
    command: celery -A applanner worker -l INFO --concurrency=2
    depends_on: [db, redis]

  beat:
    build: .
    restart: unless-stopped
    env_file: .env
    entrypoint: []
    command: celery -A applanner beat -l INFO --scheduler django_celery_beat.schedulers:DatabaseScheduler
    depends_on: [db, redis]

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: applanner
      POSTGRES_USER: applanner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U applanner -d applanner"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  media:
