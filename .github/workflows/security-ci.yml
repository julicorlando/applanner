name: Security and repository policy

on:
  pull_request:
  push:
    branches: [django-replatform]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: django/requirements.txt
      - name: Repository artifact policy
        run: python tools/check_repository_policy.py
      - name: Install audit tools and application dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r django/requirements.txt pip-audit ruff
          pip check
      - name: Undefined names and unused imports
        run: ruff check django --select F401,F821,F822,F823
      - name: Formatting of security tooling
        run: ruff format --check tools/check_repository_policy.py django/core/redaction.py django/core/test_redaction.py
      - name: Python vulnerability audit
        run: pip-audit
      - name: Install verified Gitleaks binary
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          printf '%s  %s\n' '79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e' '/tmp/gitleaks.tar.gz' | sha256sum --check
          tar --no-same-owner -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
      - name: Scan complete tracked tree without printing secrets
        run: |
          mkdir /tmp/applanner-source
          git archive HEAD | tar -x -C /tmp/applanner-source
          /tmp/gitleaks dir /tmp/applanner-source --config "$GITHUB_WORKSPACE/.gitleaks.toml" --redact --no-banner
      - name: Scan new commit history without printing secrets
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: /tmp/gitleaks git . --config .gitleaks.toml --log-opts="${BASE_SHA}..HEAD" --redact --no-banner
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: WhatsApp dependency audit
        working-directory: django/master-whatsapp
        run: |
          npm ci --ignore-scripts --no-fund
          npm audit --omit=dev --audit-level=low
          node --test logging.test.cjs
