name: Capture current ApPlanner previews
on:
  pull_request:
    paths:
      - django/scripts/capture_home_previews.py
      - django/templates/home.html
      - django/static/css/homepage.css
      - .github/workflows/home-preview-capture.yml
permissions:
  contents: read
jobs:
  capture:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: django/requirements.txt
      - run: pip install -r django/requirements.txt 'playwright>=1.56,<2'
      - run: playwright install --with-deps chromium
      - name: Capture disposable demo only
        run: python django/scripts/capture_home_previews.py
