{% load static %}<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><title>Sala de espera · ApPlanner</title><link rel="stylesheet" href="{% static 'healthcare/tv.css' %}"><script src="{% static 'healthcare/tv.js' %}" defer></script></head><body><header><strong>ApPlanner</strong><h1 id="tv-title">{{ display.title }}</h1><button id="tv-start">Iniciar TV e habilitar áudio</button><span id="tv-connection" role="status"></span><time id="tv-clock"></time></header><main id="tv-panel" data-feed="{% url 'waiting-room-feed' display.tenant.slug display.token %}"><section class="tv-calls"><h2>Chamada atual</h2><div id="tv-current" class="tv-current" aria-live="polite">Aguarde a chamada</div><h2>Últimas chamadas</h2><div id="tv-history"></div></section><section class="tv-media" id="tv-media" aria-label="Mídia da clínica"><div class="tv-welcome">Bem-vindo!<p>Cuide do seu bem-estar.</p></div></section></main><footer><span>{{ display.tenant.name }}</span><span id="tv-link"></span></footer></body></html>
