{% if page.has_other_pages %}<nav class="form-actions" aria-label="Paginação">{% if page.has_previous %}<a class="button" href="?page={{ page.previous_page_number }}&amp;q={{ q|urlencode }}">Anterior</a>{% endif %}<span>Página {{ page.number }} de {{ page.paginator.num_pages }}</span>{% if page.has_next %}<a class="button" href="?page={{ page.next_page_number }}&amp;q={{ q|urlencode }}">Próxima</a>{% endif %}</nav>{% endif %}
