{% extends "base.html" %}
{% block title %}Nova senha — ApPlanner{% endblock %}
{% block body_class %}guided-account-page{% endblock %}
{% block content %}
<section class="shell portal-page narrow">
  <div class="portal-heading"><div><span class="eyebrow">SEGURANÇA</span><h1>Definir nova senha</h1></div></div>
  <form method="post" class="portal-form panel">{% csrf_token %}
    <div class="form-field"><label for="security-password">Nova senha</label><input id="security-password" type="password" name="password" minlength="12" autocomplete="new-password" required></div>
    <div class="form-field"><label for="security-password_confirmation">Confirmar nova senha</label><input id="security-password_confirmation" type="password" name="password_confirmation" minlength="12" autocomplete="new-password" required></div>
    <div class="form-actions"><button class="button primary">Salvar nova senha</button></div>
  </form>
</section>
{% endblock %}
